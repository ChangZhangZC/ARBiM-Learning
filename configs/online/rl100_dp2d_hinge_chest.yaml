# Task 6 V1 Online PPO. Set policy.checkpoint_path to a VERIFIED Hinge-Chest IL model.
# No upstream code is edited. Offline RL/IQL, CM, DDP and asymmetric RL are excluded.
env:
  backend: duobench
  task: hinge_chest
  headless: true
  control_mode: joints
  relative_to: none
  frequency: 30
  camera_resolution: null
  realtime: false
  async_control: true
  binary_gripper: true
  binarize_state_gripper: true
  gripper_threshold: 0.9
  max_episode_steps: 992  # common training/evaluation episode cap; divisible by action chunk
  camera_map:
    observation.images.head: head
    observation.images.left_wrist: left_wrist
    observation.images.right_wrist: right_wrist

policy:
  checkpoint_path: null  # required path to validated Hinge-Chest best.ckpt/last.ckpt
  weights: raw
  device: cuda:0
  # null preserves the exact IL checkpoint's action span and denoising schedule
  n_action_steps: null    # 1 for native single-step Online PPO
  num_inference_steps: null

ppo:
  max_updates: 10000   # total PPO update cycles (NOT environment steps)
  ratio_mode: chunk_joint # chunk_joint; per_action_step ONLY if n_action_steps=1
  batch_size: 1024        # RL-100 Chunk Online nominal transitions; collect whole episodes
  mini_batch_size: 128    # RL-100 Chunk Online
  K_epochs: 5             # RL-100 Chunk Online
  epsilon: 0.2
  gamma: 0.997           # RL-100 Chunk Online shell override
  gae_lambda: 0.95
  actor_lr: 0.000002     # RL-100 Chunk Online shell override
  critic_lr: 0.0003      # RL-100 Chunk Online shell override
  value_hidden_dim: 512  # RL-100 Chunk Online critic
  value_depth: 3
  fix_encoder: true       # unchanged Task6 constraint; native Chunk uses false (separate review)
  share_encoder: true     # unchanged Task6 constraint; native Chunk uses false (separate review)
  advantage_normalize: true
  clip_value: true       # RL-100 base PPO setting
  linear_lr_decay: true  # native RL-100 linear schedule over chunk decisions
  adaptive_kl: 0.02
  min_lr_actor: 0.0000005  # native default; unused while linear decay is enabled
  max_lr_actor: 0.00001    # native default; unused while linear decay is enabled
  min_lr_critic: 0.0001   # native default; unused while linear decay is enabled
  max_lr_critic: 0.001    # native default; unused while linear decay is enabled
reward:
  mode: env_raw          # only for end-to-end Smoke; not a validated scientific reward

rollout:
  seed: 42              # seeds for on-policy training episodes

evaluation:
  enabled: true
  every_updates: 1
  num_episodes: 2
  seed: 100042          # constant across all evaluations for comparable curves
  record_video: false
  video_source: native    # native/policy
  video_fps: 30

checkpoint:
  every_updates: 1
  keep_last: 3           # policy-only update_*.ckpt; last.ckpt always retained
  save_on_finish: true
  resume: null           # prefer --resume <run_dir> CLI
logging:
  jsonl: true
  progress_bar: true
  tensorboard:
    enabled: true        # local outputs/online/.../tensorboard/
  ratio_diagnostics:
    enabled: true
    every_updates: 5    # upstream native PPO ratio sampling; debug overhead
output:
  root: outputs/online
  run_name: run_{timestep}  # same naming contract as IL/Eval
