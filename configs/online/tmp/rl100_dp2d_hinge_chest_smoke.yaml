# TEST-ONLY TEMP CONFIG: never use for research comparisons or official baseline.
# Derived from ../rl100_dp2d_hinge_chest.yaml; all PPO changes are smoke-only.
# Task 6 V1 Online PPO. Set policy.checkpoint_path to a VERIFIED Hinge-Chest IL model.
# No upstream code is edited. Offline RL/IQL, CM, DDP and asymmetric RL are excluded.
env:
  backend: duobench
  task: hinge_chest
  headless: true
  control_mode: joints
  relative_to: none
  frequency: 30
  camera_resolution: null
  realtime: false
  async_control: true
  binary_gripper: true
  binarize_state_gripper: true
  gripper_threshold: 0.9
  max_episode_steps: 65  # smoke-only partial-chunk boundary
  camera_map:
    observation.images.head: head
    observation.images.left_wrist: left_wrist
    observation.images.right_wrist: right_wrist

policy:
  checkpoint_path: null  # required path to validated Hinge-Chest best.ckpt/last.ckpt
  weights: raw
  device: cuda:0
  # null preserves the exact IL checkpoint's action span and denoising schedule
  n_action_steps: null    # 1 for native single-step Online PPO
  num_inference_steps: null

ppo:
  max_steps: 12        # smoke-only mini-batch budget
  ratio_mode: chunk_joint # chunk_joint; per_action_step ONLY if n_action_steps=1
  batch_size: 16          # smoke-only batch; NOT a scientific experiment setting
  mini_batch_size: 8       # smoke-only
  K_epochs: 2             # smoke-only
  epsilon: 0.2
  gamma: 0.997           # RL-100 Chunk Online shell override
  gae_lambda: 0.95
  actor_lr: 0.000002     # RL-100 Chunk Online shell override
  critic_lr: 0.0003      # RL-100 Chunk Online shell override
  value_hidden_dim: 512  # RL-100 Chunk Online critic
  value_depth: 3
  fix_encoder: false      # RL-100 Chunk Online default: update Actor RGB Encoder
  share_encoder: false    # RL-100 Chunk Online default: Critic owns independent RGB Encoder
  recon: false           # native Actor Recon/VIB auxiliary loss; requires Recon/VIB IL checkpoint
  value_recon: false     # native Critic auxiliary loss; requires independent Critic Encoder
  per_step_recon: false  # native: apply Actor auxiliary loss at every DDIM step (else first only)
  advantage_normalize: true
  clip_value: true       # RL-100 base PPO setting
  linear_lr_decay: true  # native RL-100 linear schedule over chunk decisions
  adaptive_kl: 0.02
  min_lr_actor: 0.0000005  # native default; unused while linear decay is enabled
  max_lr_actor: 0.00001    # native default; unused while linear decay is enabled
  min_lr_critic: 0.0001   # native default; unused while linear decay is enabled
  max_lr_critic: 0.001    # native default; unused while linear decay is enabled
reward:
  mode: env_raw          # only for end-to-end Smoke; not a validated scientific reward

rollout:
  seed: 42              # seeds for on-policy training episodes

evaluation:
  enabled: true
  every_updates: 1   # smoke-only, force eval for each PPO cycle
  num_episodes: 2    # smoke-only, not reliable success-rate estimation
  seed: 100042          # constant across all evaluations for comparable curves
  record_video: false
  video_source: native    # native/policy
  video_fps: 30

checkpoint:
  every_steps: 6         # smoke-only: roughly one complete PPO update per checkpoint
  keep_last: 3           # policy-only update_*.ckpt; last.ckpt always retained
  save_on_finish: true
  resume: null           # prefer --resume <run_dir> CLI
logging:
  jsonl: true
  progress_bar: true   # ARBiM outer progress only; native PPO tqdm remains enabled
  tensorboard:
    enabled: true        # fresh PPO-step runs use tensorboard_ppo_steps/
  ratio_diagnostics:
    enabled: true
    every_updates: 1    # smoke-only, exercise ratio diagnostics
output:
  root: /tmp/arbim_online_smoke
  run_name: smoke_{timestep}  # isolated smoke run
