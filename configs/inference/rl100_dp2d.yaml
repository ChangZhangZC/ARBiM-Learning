# Native RL100 DP-2D inference (no environment or robot control).
# Architecture, observation/action dimensions, camera mapping, diffusion and
# Normalizer come exclusively from the checkpoint's saved contract.
inference:
  checkpoint_path: /path/to/run/checkpoints/best.ckpt  # best.ckpt or last.ckpt
  weights: raw                   # raw; ema requires last.ckpt
  device: cuda:0                 # cuda:0, cuda:1, cpu, ...
  deterministic: true            # true=native deterministic DDIM; false=stochastic
  n_action_steps: null           # null=checkpoint; optional output slice length (1..predicted steps)
