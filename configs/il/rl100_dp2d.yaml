# Native RL1002D / DP-2D IL training configuration.
# Change dataset.repo_id/root and training.task to use another LeRobot v3 dataset.
# Native RL-100 actor, loss, normalizer, diffusion and EMA remain unchanged.
# Match the Diffusion/Offline/2D *chunk two-stage shell overrides*, not the
# disabled Recon/VIB defaults in upstream rl100_2d_epsilon.yaml.
# PyYAML anchors mirror the original Hydra top-level switches: editing a
# single flag updates both vision and policy, without runtime interpolation.
use_recon: &use_recon true
use_vib: &use_vib true

dataset:
  repo_id: RobotControlStack/duobench
  root: /home/wezley/chang/datasets/duobench/transfer_cube/sim
  val_ratio: 0.02
  seed: 42
  drop_padded_action_targets: true

vision:
  rgb_model:
    name: resnet18
    weights: r3m # r3m, IMAGENET1K_V1, or null (random initialization)
  resize_shape: [224, 224] # [height, width], or null to keep original size
  crop_shape: null # null disables cropping; e.g. [200, 200] enables it
  random_crop: true # used only when crop_shape is set; false = center crop
  use_group_norm: true
  share_rgb_model: false # false = independent RGB backbones, true = shared
  imagenet_norm: true
  use_agent_pos: true
  use_vib: *use_vib # inherits root use_vib, like upstream ${use_vib}
  use_recon: *use_recon # inherits root use_recon, like upstream ${use_recon}
  recon_loss_weight: 0.05 # native chunk two-stage Offline shell
  kl_loss_weight: 1.0 # native DP-2D ResNet YAML
  kl_beta: 0.0005 # native chunk two-stage Offline shell; base YAML is 1e-4
  latent_dim: null # upstream ResNet YAML omits this => native default None

policy:
  model: dp3
  scheduler_type: ddim
  # Native RL1002D.no_pre_action=True: predicted steps = horizon - n_obs_steps + 1.
  # Here 5-2+1=4 predicted action steps; n_action_steps selects the returned slice.
  # n_action_steps may select any positive number up to the predicted steps.
  horizon: 5
  n_obs_steps: 2
  n_action_steps: 4
  num_inference_steps: 10
  obs_as_global_cond: true
  diffusion_step_embed_dim: 256
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  encoder_type: resnet
  w_pc: false
  use_aug: false # true = native RandomShiftsAug during training only
  use_recon: *use_recon # same root switch as vision.use_recon
  action_norm: true
  use_agent_pos: true

schedulers:
  ddim:
    _target_: rl_100.unidpg.diffusion_policy.diffusers_patch.ddim_with_logprob_dpok.DDIMSchedulerExtended
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 1
    prediction_type: epsilon
    clip_std_min: 0.0067
    clip_std_max: null
  cm:
    _target_: rl_100.unidpg.diffusion_policy.diffusers_patch.lcm_scheduler.LCMSchedulerExtended
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 1
    prediction_type: sample
    original_inference_steps: 10
    clip_std_min: 0.0067
    clip_std_max: null

optimizer:
  lr: 0.0001
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6
lr_scheduler:
  name: cosine
  warmup_steps: 500
ema:
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

training:
  # Output path: outputs/il/<task>/<method>/<run_name>/
  task: duobench_transfer_cube # descriptive experiment label, NOT a dataset format
  method: rl100_dp2d
  run_name: run_{timestep} # e.g. my_run_{timestep}; timestep=YYYYMMDD_HHMMSS; null=timestamp only

  device: cuda:0
  seed: 42
  # One training optimizer step uses this many dataset windows (single GPU).
  batch_size: 2
  num_workers: 2
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  max_steps: 100000 # null disables this limit; both limits apply when set
  max_epochs: null # null disables this limit; at least one must be set

output:
  root: outputs/il
  output_dir: null # explicit full run path overrides task/method/run_name

checkpoint:
  enabled: true
  resume: false # true = restore an existing run from last.ckpt
  resume_path: null # run directory or /path/to/checkpoints/last.ckpt
  every_steps: 2000 # null disables step-based snapshots
  every_epochs: null # null disables epoch-based snapshots
  save_on_finish: true
  keep_last: 3 # number of step_*.ckpt snapshots; last.ckpt always retained

validation:
  every_steps: 1000
  every_epochs: null
  on_finish: true
  seed: 1234 # fixed diffusion-noise seed; training RNG restored afterward

logging:
  log_freq_steps: 50
  progress_bar: true
  jsonl: true
  tensorboard:
    enabled: true # pip install tensorboard
  wandb:
    enabled: false # optional: pip install wandb
    project: arbim_il
    entity: null
    mode: online # online, offline or disabled
