# Minimal Python 3.12 development baseline for ARBiM-Learning.
# Upstream submodules are pinned separately; they are NOT installed by this file.
# Versions are selected from LeTools-Learning and RL-100, but not yet runtime-validated together.
name: arbim-learning
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # Match LeTools' PyTorch version and the official torchvision pairing.
      # CUDA wheel selection must be checked on the target GPU machine.
      - torch==2.9.1
      - torchvision==0.24.1

      # Core arrays, configuration, native diffusion and checkpoint utilities.
      - "numpy>=2.0,<2.3"
      - einops==0.8.1
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - diffusers==0.33.1
      - "huggingface-hub>=1.0,<2.0"
      - "safetensors>=0.4.3,<1.0"
      - "zarr>=2.18,<3.0"
      - "dill>=0.3.8,<0.4"
      - "matplotlib>=3.8,<4.0"
      - "termcolor>=2.4,<4.0"
      - "tqdm>=4.66,<5.0"

# Deferred: LeRobot [dataset] extras (PyAV/TorchCodec), PyTorch3D, R3M, Open3D,
# and all DuoBench, ROS, real-robot, and RL-specific dependencies.
